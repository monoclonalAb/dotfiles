# First remove *all* keybindings
# unbind-key -a
# Now reinsert all the regular tmux keys
bind ^X lock-server
bind ^C new-window -c '#{pane_current_path}'
bind ^D detach
bind * list-clients

bind H previous-window
bind L next-window

bind r command-prompt "rename-window %%"
bind R source-file ~/.config/tmux/tmux.conf
bind ^A last-window
bind ^W list-windows
bind w choose-session
bind z resize-pane -Z
bind ^L refresh-client
bind l refresh-client
bind '\' split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r -T prefix H resize-pane -L 10
bind -r -T prefix J resize-pane -D 7
bind -r -T prefix K resize-pane -U 7
bind -r -T prefix L resize-pane -R 10
bind : command-prompt
bind * setw synchronize-panes
bind P set pane-border-status
bind c kill-pane
bind s new-session -c "$HOME"
bind x swap-pane -D
bind R source-file ~/.config/tmux/tmux.conf

# Cycle current window between two custom grid layouts (overrides default next-layout):
#   1st press -> A: big pane LEFT (50% w, full h) + grid on the right
#   2nd press -> B: big pane TOP  (full w, 50% h) + grid on the bottom
# Grid follows pane count: 5 panes -> 2x2, 7 panes -> 3x2.
# Any other count leaves the window unchanged (never spawns or kills panes).
bind Space run-shell '~/.config/tmux/cycle-2x2.sh'

bind-key -T copy-mode-vi v send-keys -X begin-selection
