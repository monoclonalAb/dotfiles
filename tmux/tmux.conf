source-file ~/.config/tmux/tmux.reset.conf # keybinds

set-option -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Set default terminal option in case if it's missing
set -g default-terminal "xterm"

# Fix helix color highliting
set-option -sa terminal-overrides ",*256col*:RGB"

# Fix color highliting
set-option -sa terminal-overrides ",xterm*:Tc"

set -g mouse on

set -g prefix ^A # changing the prefix key

set -g base-index 1
setw -g pane-base-index 1 

set -g set-titles on 

set -g renumber-windows on
set -g status-position top
set-option -g detach-on-destroy off

set -g @catppuccin_flavor 'latte'
# ...overridden by the shared theme state, if the `theme` script has ever run.
# -q: the state lives outside the repo, so a fresh machine won't have it yet.
# Must stay above the tpm `run` line below so the plugin sees the final value.
source-file -q ~/.local/state/theme/tmux.conf

# List of plugins
set -g @plugin 'tmux-plugins/tpm' # plugin manager

set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @plugin 'catppuccin/tmux#v2.1.3' # catppuccin theme

# window
set -g @catppuccin_window_status_style "custom"

set -g @catppuccin_window_left_separator "#[bg=default,fg=#{@thm_surface_0}]#[bg=#{@thm_surface_0},fg=#{@thm_fg}]"
set -g @catppuccin_window_right_separator "#[bg=default,fg=#{@thm_surface_0}]"
set -g @catppuccin_window_current_left_separator "#[bg=default,fg=#{@thm_mauve}]#[bg=#{@thm_mauve},fg=#{@thm_bg}]"
set -g @catppuccin_window_current_middle_separator "#[fg=#{@thm_mauve}]█"
set -g @catppuccin_window_current_right_separator "#[bg=default,fg=#{@thm_surface_1}]"

set -g @catppuccin_window_default_text " #W"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Make the status line pretty and add some modules
set -g @catppuccin_status_default "on"
set -g @catppuccin_status_background "none"
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_directory}#{E:@catppuccin_status_application}#{E:@catppuccin_status_session} #{@ct_status}"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"

set -g status-left ""

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

# Fix: Catppuccin sets message-style/message-command-style with `align=centre`,
# which makes the command prompt (e.g. prefix+r rename-window) render shoved to
# the middle/right, on top of the window-tab list instead of replacing it.
# Force `align=left` so the prompt takes the left of the status line and clears
# the tabs. Must come after the tpm run above so it overrides the plugin.
# @thm_teal (rather than a literal) so this follows the flavour when `theme`
# switches it. -F expands the format at set time, which is how catppuccin itself
# assigns these two options; without it tmux would store the `#{...}` verbatim.
set -gF message-style "fg=#{@thm_teal},bg=default,align=left"
set -gF message-command-style "fg=#{@thm_teal},bg=default,align=left"

# conducterm — the agent-fleet layer (M-a list / M-g go to waiting / M-o back).
# @ct_status_installed is set BEFORE the source-file line on purpose: the
# generated file otherwise *appends* its segment to status-right, and this
# config assigns status-right outright above — so every `prefix + R` reload
# would wipe the appended segment until the next server restart. Setting the
# switch suppresses the append; the `#{@ct_status}` reference lives in that
# assignment instead, and therefore survives reloads.
set -s @ct_status_installed 1
# -q: this file lives outside the repo, so a fresh machine won't have it yet.
source-file -q ~/.conducterm/conducterm.tmux
