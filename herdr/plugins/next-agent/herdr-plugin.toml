id = "martinro.next-agent"
name = "Next Agent"
version = "0.7.0-local"
min_herdr_version = "0.8.0"
platforms = ["linux", "macos"]

[[actions]]
id = "jump"
title = "Jump to next agent needing attention"
contexts = ["global", "workspace"]
command = ["python3.14", "next_agent.py"]

[[actions]]
id = "back"
title = "Return to the pane focused before the agent jumps"
contexts = ["global", "workspace"]
command = ["python3.14", "next_agent.py", "back"]

[[actions]]
id = "toggle-unread"
title = "Keep the focused conversation unread until you reply, or mark it read"
contexts = ["global", "workspace"]
command = ["python3.14", "next_agent.py", "toggle-unread"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3.14", "next_agent.py"]

[[events]]
on = "pane.focused"
command = ["python3.14", "next_agent.py"]

[[startup]]
command = ["python3.14", "next_agent.py"]

[[events]]
on = "pane.agent_detected"
command = ["python3.14", "next_agent.py"]
